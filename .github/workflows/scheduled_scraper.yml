      - name: Combine into _all_ file
        run: |
          python scraping_tasks/combine_data.py --entity transfers
      
      - name: Upload all transfers data
        uses: actions/upload-artifact@v4
        with:
          name: transfers-all-data
          path: data/transfers_*.json
          retention-days: 1

  # ============================================================
  # VALUATIONS - Matrix by league
  # ============================================================
  scrape-valuations:
    needs: combine-transfers
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        league: [laliga, premier, bundesliga, seriea, ligue1]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run valuations scraper for ${{ matrix.league }}
        run: |
          python scraping_tasks/scrape_valuations.py --leagues ${{ matrix.league }}
      
      - name: Upload league artifact
        uses: actions/upload-artifact@v4
        with:
          name: valuations-${{ matrix.league }}
          path: data/valuations_${{ matrix.league }}_*.json
          retention-days: 1
          if-no-files-found: error

  combine-valuations:
    needs: scrape-valuations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Download all league artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: valuations-*
          merge-multiple: true
      
      - name: Combine into _all_ file
        run: |
          python scraping_tasks/combine_data.py --entity valuations
      
      - name: Upload all valuations data
        uses: actions/upload-artifact@v4
        with:
          name: valuations-all-data
          path: data/valuations_*.json
          retention-days: 1

  # ============================================================
  # FINAL COMMIT - All data
  # ============================================================
  commit-all:
    needs: [combine-leagues, combine-teams, combine-players, combine-transfers, combine-valuations]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download leagues data
        uses: actions/download-artifact@v4
        with:
          name: leagues-all-data
          path: data/
      
      - name: Download teams data
        uses: actions/download-artifact@v4
        with:
          name: teams-all-data
          path: data/
      
      - name: Download players data
        uses: actions/download-artifact@v4
        with:
          name: players-all-data
          path: data/
      
      - name: Download transfers data
        uses: actions/download-artifact@v4
        with:
          name: transfers-all-data
          path: data/
      
      - name: Download valuations data
        uses: actions/download-artifact@v4
        with:
          name: valuations-all-data
          path: data/
      
      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          ls -la data/
      
      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Commit changes
        run: |
          git add data/
          git diff --staged --quiet || git commit -m "Monthly data update [$(date -u '+%Y-%m-%d')]"
      
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

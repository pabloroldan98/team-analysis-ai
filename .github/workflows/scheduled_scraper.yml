# .github/workflows/scheduled_scraper.yml
name: Scheduled Scraper - All Data

on:
  workflow_dispatch:
  schedule:
    # 1st of each month at 1:00 AM UTC
    - cron: '0 1 1 * *'

concurrency:
  group: scheduled-scraper
  cancel-in-progress: false

jobs:
  # ============================================================
  # LEAGUES - Matrix by league
  # ============================================================
  scrape-leagues:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        league: [laliga, premier, bundesliga, seriea, ligue1]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run leagues scraper for ${{ matrix.league }}
        run: |
          python scraping_tasks/scrape_leagues.py --leagues ${{ matrix.league }}
      
      - name: Upload league artifact
        uses: actions/upload-artifact@v4
        with:
          name: leagues-${{ matrix.league }}
          path: data/leagues_${{ matrix.league }}_*.json
          retention-days: 1
          if-no-files-found: error

  combine-leagues:
    needs: scrape-leagues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Download all league artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: leagues-*
          merge-multiple: true
      
      - name: Combine into _all_ file
        run: |
          python scraping_tasks/combine_data.py --entity leagues
      
      - name: Upload all leagues data
        uses: actions/upload-artifact@v4
        with:
          name: leagues-all-data
          path: data/leagues_*.json
          retention-days: 1

  # ============================================================
  # TEAMS - Matrix by league
  # ============================================================
  scrape-teams:
    needs: combine-leagues
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        league: [laliga, premier, bundesliga, seriea, ligue1]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run teams scraper for ${{ matrix.league }}
        run: |
          python scraping_tasks/scrape_teams.py --leagues ${{ matrix.league }}
      
      - name: Upload league artifact
        uses: actions/upload-artifact@v4
        with:
          name: teams-${{ matrix.league }}
          path: data/teams_${{ matrix.league }}_*.json
          retention-days: 1
          if-no-files-found: error

  combine-teams:
    needs: scrape-teams
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Download all league artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: teams-*
          merge-multiple: true
      
      - name: Combine into _all_ file
        run: |
          python scraping_tasks/combine_data.py --entity teams
      
      - name: Upload all teams data
        uses: actions/upload-artifact@v4
        with:
          name: teams-all-data
          path: data/teams_*.json
          retention-days: 1

  # ============================================================
  # PLAYERS - Matrix by league
  # ============================================================
  scrape-players:
    needs: combine-teams
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        league: [laliga, premier, bundesliga, seriea, ligue1]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run players scraper for ${{ matrix.league }}
        run: |
          python scraping_tasks/scrape_players.py --leagues ${{ matrix.league }}
      
      - name: Upload league artifact
        uses: actions/upload-artifact@v4
        with:
          name: players-${{ matrix.league }}
          path: data/players_${{ matrix.league }}_*.json
          retention-days: 1
          if-no-files-found: error

  combine-players:
    needs: scrape-players
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Download all league artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: players-*
          merge-multiple: true
      
      - name: Combine into _all_ file
        run: |
          python scraping_tasks/combine_data.py --entity players
      
      - name: Upload all players data
        uses: actions/upload-artifact@v4
        with:
          name: players-all-data
          path: data/players_*.json
          retention-days: 1

  # ============================================================
  # TRANSFERS - Matrix by league
  # ============================================================
  scrape-transfers:
    needs: combine-players
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        league: [laliga, premier, bundesliga, seriea, ligue1]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run transfers scraper for ${{ matrix.league }}
        run: |
          python scraping_tasks/scrape_transfers.py --leagues ${{ matrix.league }}
      
      - name: Upload league artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfers-${{ matrix.league }}
          path: data/transfers_${{ matrix.league }}_*.json
          retention-days: 1
          if-no-files-found: error

  combine-transfers:
    needs: scrape-transfers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Download all league artifacts
        uses: actions/download-artifact@v4
        with:

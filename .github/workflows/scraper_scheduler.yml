name: Scheduler - Transfermarkt Scraper

on:
  schedule:
    # Runs every Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      team_name:
        description: 'Team name to scrape (leave empty for default leagues)'
        required: false
        type: string
      league:
        description: 'League to scrape'
        required: false
        type: choice
        options:
          - ''
          - laliga
          - premier
          - seriea
          - bundesliga
          - ligue1
      season:
        description: 'Season (e.g., 2024-2025)'
        required: false
        type: string
      include_transfers:
        description: 'Include transfer history'
        required: false
        type: boolean
        default: true
      include_valuations:
        description: 'Include valuation history'
        required: false
        type: boolean
        default: false

jobs:
  scrape_transfermarkt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper (manual team)
        if: ${{ github.event.inputs.team_name != '' }}
        run: |
          python -m scraping.transfermarkt_scraper \
            --team "${{ github.event.inputs.team_name }}" \
            --season "${{ github.event.inputs.season || '2024-2025' }}" \
            ${{ github.event.inputs.include_transfers == 'false' && '--no-transfers' || '' }} \
            ${{ github.event.inputs.include_valuations == 'false' && '--no-valuations' || '' }}

      - name: Run scraper (manual league)
        if: ${{ github.event.inputs.league != '' && github.event.inputs.team_name == '' }}
        run: |
          python -m scraping.transfermarkt_scraper \
            --league "${{ github.event.inputs.league }}" \
            --season "${{ github.event.inputs.season || '2024-2025' }}" \
            --no-details \
            ${{ github.event.inputs.include_transfers == 'false' && '--no-transfers' || '' }} \
            ${{ github.event.inputs.include_valuations == 'false' && '--no-valuations' || '' }}

      - name: Run scraper (scheduled - top leagues)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          # Scrape top 5 leagues
          for league in laliga premier seriea bundesliga ligue1; do
            echo "Scraping $league..."
            python -m scraping.transfermarkt_scraper \
              --league "$league" \
              --no-details \
              --no-valuations \
              --delay 3.0
          done

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-data
          path: |
            data/json/*.json
            data/csv/*.csv
          retention-days: 30

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit and push changes
        run: |
          git add data/json/*.json data/csv/*.csv || true
          git diff --staged --quiet || git commit -m "Automated data update: $(date '+%Y-%m-%d %H:%M')"
          git push || echo "Nothing to push"

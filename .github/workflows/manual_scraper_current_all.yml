      - name: Pre-load TLS client (suppress download progress)
        run: python -c "import tls_requests; tls_requests.get('https://httpbin.org/get', timeout=10)" > /dev/null 2>&1 || true

      - name: Download all valuation artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/json/
          pattern: valuations-*
          merge-multiple: true

      - name: Combine into _all_ files
        run: |
          SEASONS=$(ls data/json/valuations_*.json 2>/dev/null | grep -v '_all_' | grep -v '_OLD' | sed -E 's/.*_([0-9]{4}-[0-9]{4})\.json/\1/' | sort -u)
          for season in $SEASONS; do
            python scraping_tasks/combine_data.py --entity valuations --season $season
          done
          for f in data/json/valuations_all_*.json; do
            s=$(echo "$f" | grep -oP '\d{4}-\d{4}')
            echo "$SEASONS" | grep -q "^${s}$" || rm -f "$f"
          done

      - name: Upload all valuations data
        uses: actions/upload-artifact@v4
        with:
          name: valuations-all-data
          path: data/json/valuations_all_*.json
          retention-days: 3

  # ============================================================
  # COMPETITIONS
  # ============================================================
  scrape-competitions:
    if: ${{ inputs.entity == 'all' || inputs.entity == 'competitions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        league:
          # Europe – Tier 1
          - laliga
          - premier
          - seriea
          - bundesliga
          - ligue1
          - liga_portugal
          - turkish
          - eredivisie
          - russian
          - belgian
          - greek
          - danish
          - ukrainian
          - czech
          - polish
          - swiss
          - scottish
          - austrian
          - norwegian
          - serbian
          - romanian
          - swedish
          - croatian
          - bulgarian
          - israeli
          - cypriot
          - hungarian
          - azerbaijani
          - slovak
          # Europe – Tier 2
          - segunda
          - championship
          - serieb
          - bundesliga2
          - ligue2
          - liga_portugal2
          - turkish2
          - dutch2
          - belgian2
          - russian2
          # Europe – Tier 3
          - leagueone
          - bundesliga3
          - seriec1
          - seriec2
          - seriec3
          - primeraref1
          - primeraref2
          # Europe – Tier 4
          - leaguetwo
          # Americas – Tier 1
          - brazilian
          - mls
          - argentine
          - mexican
          - colombian
          - uruguayan
          - chilean
          - ecuadorian
          - peruvian
          - paraguayan
          # Americas – Tier 2
          - brazilian2
          - argentine2
          # Asia – Tier 1
          - saudi
          - qatari
          - emirati
          - japanese
          - chinese
          - iranian
          - korean
          - australian
          # Asia – Tier 2
          - japanese2
          # Africa – Tier 1
          - egyptian
          - south_african
          - moroccan
          # Youth
          - primavera1
          - u19_bundesliga_a
          - u19_bundesliga_h
          - liga_revelacao
        season:
          - ${{ inputs.season }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-load TLS client (suppress download progress)
        run: python -c "import tls_requests; tls_requests.get('https://httpbin.org/get', timeout=10)" > /dev/null 2>&1 || true

      - name: Run competitions scraper for ${{ matrix.league }} (${{ matrix.season }})
        run: |
          python scraping_tasks/scrape_competitions.py --leagues ${{ matrix.league }} --season ${{ matrix.season }} --use-downloaded-data

      - name: Upload competition artifact
        uses: actions/upload-artifact@v4
        with:
          name: competitions-${{ matrix.league }}-${{ matrix.season }}
          path: data/json/competitions_${{ matrix.league }}_${{ matrix.season }}.json
          retention-days: 3
          if-no-files-found: error

  combine-competitions:
    if: ${{ inputs.entity == 'all' || inputs.entity == 'competitions' }}
    needs: scrape-competitions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Pre-load TLS client (suppress download progress)
        run: python -c "import tls_requests; tls_requests.get('https://httpbin.org/get', timeout=10)" > /dev/null 2>&1 || true

      - name: Download all competition artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/json/
          pattern: competitions-*
          merge-multiple: true

      - name: Combine into _all_ files
        run: |
          SEASONS=$(ls data/json/competitions_*.json 2>/dev/null | grep -v '_all_' | grep -v '_OLD' | sed -E 's/.*_([0-9]{4}-[0-9]{4})\.json/\1/' | sort -u)
          for season in $SEASONS; do
            python scraping_tasks/combine_data.py --entity competitions --season $season
          done
          for f in data/json/competitions_all_*.json; do
            s=$(echo "$f" | grep -oP '\d{4}-\d{4}')
            echo "$SEASONS" | grep -q "^${s}$" || rm -f "$f"
          done

      - name: Upload all competitions data
        uses: actions/upload-artifact@v4
        with:
          name: competitions-all-data
          path: data/json/competitions_all_*.json
          retention-days: 3

  # ============================================================
  # FINAL COMMIT
  # ============================================================
  commit-all:
    needs: [combine-leagues, combine-teams, combine-players, combine-transfers, combine-valuations, combine-competitions]
    if: |
      always() &&
      (needs.combine-leagues.result == 'success' || needs.combine-leagues.result == 'skipped') &&
      (needs.combine-teams.result == 'success' || needs.combine-teams.result == 'skipped') &&
      (needs.combine-players.result == 'success' || needs.combine-players.result == 'skipped') &&
      (needs.combine-transfers.result == 'success' || needs.combine-transfers.result == 'skipped') &&
      (needs.combine-valuations.result == 'success' || needs.combine-valuations.result == 'skipped') &&
      (needs.combine-competitions.result == 'success' || needs.combine-competitions.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download leagues data
        if: ${{ inputs.entity == 'all' || inputs.entity == 'leagues' }}
        uses: actions/download-artifact@v4
        with:
          name: leagues-all-data
          path: data/json/
        continue-on-error: true

      - name: Download teams data
        if: ${{ inputs.entity == 'all' || inputs.entity == 'teams' }}
        uses: actions/download-artifact@v4
        with:
          name: teams-all-data
          path: data/json/
        continue-on-error: true

      - name: Download players data
        if: ${{ inputs.entity == 'all' || inputs.entity == 'players' }}
        uses: actions/download-artifact@v4
        with:
          name: players-all-data
          path: data/json/
        continue-on-error: true

      - name: Download transfers data
        if: ${{ inputs.entity == 'all' || inputs.entity == 'transfers' }}
        uses: actions/download-artifact@v4
        with:
          name: transfers-all-data
          path: data/json/
        continue-on-error: true

      - name: Download valuations data
        if: ${{ inputs.entity == 'all' || inputs.entity == 'valuations' }}
        uses: actions/download-artifact@v4
        with:
          name: valuations-all-data
          path: data/json/
        continue-on-error: true

      - name: Download competitions data
        if: ${{ inputs.entity == 'all' || inputs.entity == 'competitions' }}
        uses: actions/download-artifact@v4
        with:
          name: competitions-all-data
          path: data/json/
        continue-on-error: true

      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          ls -la data/json/

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update auto-update trigger in streamlit_app.py
        run: |
          TRIGGER_LINE="# Auto-update trigger: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if grep -q "^# Auto-update trigger:" streamlit_app.py; then
            sed -i "s/^# Auto-update trigger:.*/$TRIGGER_LINE/" streamlit_app.py
          else
            echo "$TRIGGER_LINE" >> streamlit_app.py
          fi

      - name: Commit changes
        run: |
          git add data/json/ streamlit_app.py
          git diff --staged --quiet || git commit -m "All leagues data update [$(date -u '+%Y-%m-%d')]"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main


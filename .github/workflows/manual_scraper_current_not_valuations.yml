          - j3_league_jap3

          # Youth
          - primavera1
          - cbf_brasileiro_u20_cb20
          - u19_bundesliga_a
          - liga_revelacao
        season:
          - 2025-2026
          # - 2024-2025
          # - 2023-2024
          # - 2022-2023
          # - 2021-2022
          # - 2020-2021
          # - 2019-2020
          # - 2018-2019
          # - 2017-2018
          # - 2016-2017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-load TLS client (suppress download progress)
        run: python -c "import tls_requests; tls_requests.get('https://httpbin.org/get', timeout=10)" > /dev/null 2>&1 || true

      - name: Run valuations scraper for ${{ matrix.league }} (${{ matrix.season }})
        run: |
          python scraping_tasks/scrape_valuations.py --leagues ${{ matrix.league }} --season ${{ matrix.season }} --use-downloaded-data

      - name: Upload valuation artifact
        uses: actions/upload-artifact@v4
        with:
          name: valuations-${{ matrix.league }}-${{ matrix.season }}
          path: data/datasets/valuations/valuations_${{ matrix.league }}_${{ matrix.season }}.json
          retention-days: 3
          if-no-files-found: error

  combine-valuations:
    if: false
    needs: scrape-valuations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Pre-load TLS client (suppress download progress)
        run: python -c "import tls_requests; tls_requests.get('https://httpbin.org/get', timeout=10)" > /dev/null 2>&1 || true

      - name: Download all valuation artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          pattern: valuations-*
          merge-multiple: true

      - name: Combine into _all_ files
        run: |
          SEASONS=$(ls data/datasets/valuations/valuations_*.json 2>/dev/null | grep -v '_all_' | grep -v '_OLD' | sed -E 's/.*_([0-9]{4}-[0-9]{4})\.json/\1/' | sort -u)
          for season in $SEASONS; do
            python scraping_tasks/combine_data.py --entity valuations --season $season
          done
          for f in data/datasets/valuations/valuations_all_*.json; do
            s=$(echo "$f" | grep -oP '\d{4}-\d{4}')
            echo "$SEASONS" | grep -q "^${s}$" || rm -f "$f"
          done

      - name: Upload all valuations data
        uses: actions/upload-artifact@v4
        with:
          name: valuations-all-data
          path: data/datasets/valuations/valuations_all_*.json
          retention-days: 3

  # ============================================================
  # FINAL COMMIT
  # ============================================================
  commit-all:
    # needs: [combine-leagues, combine-teams, combine-players, combine-transfers, combine-valuations]
    needs: [combine-leagues, combine-teams, combine-players, combine-transfers]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download leagues data
        uses: actions/download-artifact@v4
        with:
          name: leagues-all-data
          path: data/

      - name: Download teams data
        uses: actions/download-artifact@v4
        with:
          name: teams-all-data
          path: data/

      - name: Download players data
        uses: actions/download-artifact@v4
        with:
          name: players-all-data
          path: data/

      - name: Download transfers data
        uses: actions/download-artifact@v4
        with:
          name: transfers-all-data
          path: data/

      # - name: Download valuations data
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: valuations-all-data
      #     path: data/

      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          ls -la data/

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update auto-update trigger in streamlit_app.py
        run: |
          TRIGGER_LINE="# Auto-update trigger: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if grep -q "^# Auto-update trigger:" streamlit_app.py; then
            sed -i "s/^# Auto-update trigger:.*/$TRIGGER_LINE/" streamlit_app.py
          else
            echo "$TRIGGER_LINE" >> streamlit_app.py
          fi

      - name: Commit changes
        run: |
          git add data/ streamlit_app.py
          git diff --staged --quiet || git commit -m "All leagues (not valuations) data update [$(date -u '+%Y-%m-%d')]"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

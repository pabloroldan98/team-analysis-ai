# .github/workflows/scrape_all.yml
name: Scrape All Data

on:
  workflow_dispatch:  # Manual trigger (no inputs needed)
  schedule:
    # Monthly on the 15th at 1:00 AM UTC (full refresh)
    - cron: '0 1 15 * *'

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run all scrapers
        run: |
          python scraping_tasks/scrape_all.py
      
      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ assets/logos/
          git diff --staged --quiet || git commit -m "Full data update [$(date -u '+%Y-%m-%d')]"
          git push

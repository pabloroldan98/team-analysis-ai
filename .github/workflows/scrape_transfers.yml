# .github/workflows/scrape_transfers.yml
name: Scrape Transfers

on:
  workflow_dispatch:  # Manual trigger (no inputs needed)
  schedule:
    # Weekly on Sunday at 4:00 AM UTC
    - cron: '0 4 * * 0'

jobs:
  scrape-transfers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run transfers scraper
        run: |
          python scraping_tasks/scrape_transfers.py
      
      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "Update transfers data [$(date -u '+%Y-%m-%d')]"
          git push
